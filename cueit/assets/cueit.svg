<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- waveform bars -->
  <g fill="url(#wave)">
    <rect x="40"  y="104" width="12" height="48" rx="6"/>
    <rect x="62"  y="80"  width="12" height="96" rx="6"/>
    <rect x="84"  y="112" width="12" height="32" rx="6"/>
    <rect x="106" y="64"  width="12" height="128" rx="6"/>
    <rect x="128" y="92"  width="12" height="72" rx="6"/>
    <rect x="150" y="108" width="12" height="40" rx="6"/>
    <rect x="172" y="72"  width="12" height="112" rx="6"/>
    <rect x="194" y="100" width="12" height="56" rx="6"/>
  </g>

  <!-- cue pin marker -->
  <g>
    <path d="M128 40 C112 40 100 52 100 68 C100 88 128 116 128 116 C128 116 156 88 156 68 C156 52 144 40 128 40 Z"
          fill="url(#pin)" stroke="#0d1424" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="128" cy="68" r="11" fill="#0d1424"/>
    <path d="M128 47 L128 60" stroke="#0d1424" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
