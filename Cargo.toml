[workspace]
resolver = "2"
members = [
    "crates/cueit-core",
    "crates/cueit-cli",
    "crates/cueit-tauri",
    "crates/cueit-wasm",
]

[workspace.package]
version = "0.2.0-alpha.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/CurePortal/Cueit"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# The DSP engine is compute-heavy, so even dev builds need optimization (a
# 4-minute track is ~45s at opt-level 0). A single level for everything avoids
# the per-package override path, which produced LLVM `anon.*.llvm.*` symbols
# that the system linker could not resolve.
[profile.dev]
opt-level = 2
