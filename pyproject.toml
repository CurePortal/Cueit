[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cueit"
version = "0.2.0"
description = "Open-source automatic cue-point detection and export for DJ libraries (the free Mixed In Key)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CueIt contributors" }]
keywords = ["dj", "cue-points", "key-detection", "bpm", "essentia", "rekordbox", "mixxx"]
dependencies = [
    "essentia>=2.1b6.dev1438",
    "numpy>=1.25",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
cueit = "cueit.cli:main"

[project.gui-scripts]
cueit-gui = "cueit.app:main"

[project.urls]
Homepage = "https://github.com/CurePortal/Cueit"
Repository = "https://github.com/CurePortal/Cueit"
Issues = "https://github.com/CurePortal/Cueit/issues"

[tool.hatch.build.targets.wheel]
packages = ["cueit"]

[tool.hatch.build.targets.wheel.force-include]
"cueit/assets" = "cueit/assets"

[tool.hatch.build.targets.sdist]
include = ["cueit", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
