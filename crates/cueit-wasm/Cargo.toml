[package]
name = "cueit-wasm"
description = "WebAssembly bindings for CueIt (browser analysis with Web Audio-decoded PCM)"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/CurePortal/Cueit"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No default features: the web build must not pull in the native ffmpeg decode.
cueit-core = { path = "../cueit-core", default-features = false }
wasm-bindgen = "0.2"
serde.workspace = true
serde-wasm-bindgen = "0.6"
